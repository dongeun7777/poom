  <text class="lb" x="101" y="312" text-anchor="middle">지금</text>
  <text class="mn" x="101" y="328" text-anchor="middle">원단과 같은 색</text>

  <g transform="translate(236,10) scale(.9)" color="#A9843F"><use href="#mk-suit"/></g>
